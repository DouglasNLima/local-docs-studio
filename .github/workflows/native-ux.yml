name: Validate native desktop UX
on:
  push:
    branches: ['feature/native-mermaid-suite-ux-performance', 'feature/native-mermaid-class-visual-editor', 'feature/native-mermaid-er-visual-editor', 'integration/native-wpf-candidate', 'feature/native-desktop-ux-modernisation', 'feature/native-ux-refinement', 'feature/native-mermaid-visual-editor', 'feature/native-mermaid-editor-visual-polish']
  pull_request:
    branches: ['feature/native-mermaid-class-visual-editor', 'feature/native-mermaid-er-visual-editor', develop, 'release/native-preview-readiness', 'feature/native-desktop-ux-modernisation', 'feature/native-ux-refinement', 'feature/native-mermaid-visual-editor', 'feature/native-mermaid-editor-visual-polish', 'feature/native-workspace-mermaid-interaction-stability']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite-workspace:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appearance: [normal, high-contrast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact-source suite workspace checks
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Measure native presentation, selection and retained-window lifecycle without UIA transport
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --suite-lifecycle artifacts/native/suite-ui/lifecycle $appearance
          exit $LASTEXITCODE
      - name: Exercise five-family shared workspace with real keyboard and Windows UIA
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --suite-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/suite-ui $appearance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-suite-workspace-${{ matrix.appearance }}
          path: artifacts/native/suite-ui/
          retention-days: 14
  suite-performance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build candidate and immutable consolidated baseline on the same host
        run: |
          dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach artifacts/native/suite-base 6a94dd3672f95a267402e2218935d064a6ee6401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build artifacts/native/suite-base/src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.* artifacts/native/suite-base/src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/ -Force
      - name: Measure identical seven-sample fixtures with the same harness binary before and after
        run: |
          & artifacts/native/suite-base/src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --suite-performance artifacts/native/suite-performance/before
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --suite-performance artifacts/native/suite-performance/after
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $before = Get-Content artifacts/native/suite-performance/before/suite-performance.json -Raw | ConvertFrom-Json
          $after = Get-Content artifacts/native/suite-performance/after/suite-performance.json -Raw | ConvertFrom-Json
          if ($before.HarnessSha256 -ne $after.HarnessSha256 -or $before.Observations.Count -ne 10 -or $after.Observations.Count -ne 10) { throw 'Comparative harness or workload count differs.' }
          if (($before.Host | ConvertTo-Json -Compress) -ne ($after.Host | ConvertTo-Json -Compress)) { throw 'Comparative runner environment differs.' }
          for ($index = 0; $index -lt 10; $index++) {
            $left = $before.Observations[$index]; $right = $after.Observations[$index]
            if ($left.SourceSha256 -ne $right.SourceSha256 -or $left.Family -ne $right.Family -or $left.Size -ne $right.Size -or $left.Samples.Count -ne 7 -or $right.Samples.Count -ne 7) { throw 'Comparative source, family or sample count differs.' }
            if (@($left.Samples + $right.Samples | Where-Object { -not $_.CanonicalPixelsEqual }).Count -ne 0) { throw 'A measured sample omitted canonical pixel verification.' }
          }
      - name: Verify immutable cache ownership, isolation, eviction and queued cancellation
        run: |
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --suite-cache artifacts/native/suite-performance/cache
          exit $LASTEXITCODE
      - name: Trace actual scanner, semantic, renderer, conversion and geometry phases
        run: |
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --suite-phases artifacts/native/suite-performance/phases
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-suite-performance
          path: artifacts/native/suite-performance/
          retention-days: 14
  class-visual-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appearance: [normal, high-contrast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact-source Class editor and validation harness
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify Class grammar, canonical pixels and resource observations
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --class-fidelity artifacts/native/class-fidelity $appearance
      - name: Exercise real Class member and relationship authoring, Apply, Undo, Save and reopen
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --class-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/class-ui $appearance
          exit $LASTEXITCODE
      - name: Measure actual Class opening, member and relationship selection, endpoint movement and memory
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --class-performance-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/class-performance-ui $appearance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-class-${{ matrix.appearance }}
          path: |
            artifacts/native/class-fidelity/
            artifacts/native/class-ui/
            artifacts/native/class-performance-ui/
          retention-days: 14
  er-visual-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appearance: [normal, high-contrast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact-source ER editor and validation harness
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify pinned ER grammar, occurrence mapping, canonical pixels, document ownership and resource observations
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --er-fidelity artifacts/native/er-fidelity $appearance
      - name: Exercise actual ER attributes, cardinalities, endpoint pointers, Apply, Undo, Save and reopen
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --er-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/er-ui $appearance
          exit $LASTEXITCODE
      - name: Measure actual ER opening, ordered selection, endpoint movement and memory at bounded sizes
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --er-performance-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/er-performance-ui $appearance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-er-${{ matrix.appearance }}
          path: |
            artifacts/native/er-fidelity/
            artifacts/native/er-ui/
            artifacts/native/er-performance-ui/
          retention-days: 14
  state-visual-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appearance: [normal, high-contrast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native State editor and validation harness
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify pinned State grammar, canonical pixels, source ownership and bounded performance
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --state-fidelity artifacts/native/state-fidelity $appearance
      - name: Exercise real State authoring, pointers, document Undo, Save and restart
        shell: pwsh
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --state-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/state-ui $appearance
          exit $LASTEXITCODE
      - name: Measure real State editor opening, selection, memory and pointer updates at bounded sizes
        shell: pwsh
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --state-performance-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/state-performance-ui $appearance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-state-${{ matrix.appearance }}
          path: |
            artifacts/native/state-fidelity/
            artifacts/native/state-ui/
            artifacts/native/state-performance-ui/
          retention-days: 14
  sequence-visual-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appearance: [normal, high-contrast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native Sequence editor and validation harness
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify canonical Sequence pixels and geometry; record performance
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --sequence-fidelity artifacts/native/sequence-fidelity
      - name: Exercise native Sequence authoring, document ownership, Save and reopen
        shell: pwsh
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --sequence-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/sequence-ui $appearance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sequence-${{ matrix.appearance }}
          path: |
            artifacts/native/sequence-fidelity/
            artifacts/native/sequence-ui/
          retention-days: 14
  partial-source-baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reproduce independent-edit protection at the exact PR 30 baseline
        shell: pwsh
        run: |
          git worktree add --detach artifacts/native/partial-base 833e9db1f8643f7023143dd94349a2709f9ae9ce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath tests/fixtures/native-mermaid-visual/MermaidPartialBaselineTests.cs -Destination artifacts/native/partial-base/src/native/LensDocsStudio.Core.Tests/MermaidPartialBaselineTests.cs
          dotnet test artifacts/native/partial-base/src/native/LensDocsStudio.Core.Tests -c Release -p:RestoreLockedMode=true --filter FullyQualifiedName~MermaidPartialBaselineTests --logger "trx;LogFileName=baseline-partial.trx" --results-directory artifacts/native/partial-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-partial-baseline
          path: artifacts/native/partial-baseline/
          retention-days: 14
  mermaid-visual-editor:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build source-mapped native editor and validation harness
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Compare canonical geometry and normalised native drawing pixels
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --mermaid-fidelity artifacts/native/mermaid-fidelity
      - name: Exercise visual authoring, source preservation and conflicts on disposable Windows
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --mermaid-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/mermaid-ui --polish
      - name: Measure bounded Mermaid editing scenarios
        if: always()
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --mermaid-performance artifacts/native/mermaid-performance.json
      - name: Exercise actual Windows high contrast
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --mermaid-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/mermaid-high-contrast --high-contrast --polish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mermaid-visual-evidence
          path: |
            artifacts/native/mermaid-fidelity/
            artifacts/native/mermaid-performance.json
            artifacts/native/mermaid-ui/*.png
            artifacts/native/mermaid-ui/*.json
            artifacts/native/mermaid-ui/*.txt
            artifacts/native/mermaid-ui/*.md
            artifacts/native/mermaid-high-contrast/*.png
            artifacts/native/mermaid-high-contrast/*.json
            artifacts/native/mermaid-high-contrast/*.txt
          retention-days: 14
  baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build current validation harness
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Build verified baseline in isolation
        run: |
          git worktree add --detach artifacts/native/ux-base 47e78d6bff490a9b0c0b5cb2022dab262fe14e5e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build artifacts/native/ux-base/src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Capture reproducible baseline on disposable Windows
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --ux-screenshots artifacts/native/ux-base/src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/ux-baseline 47e78d6bff490a9b0c0b5cb2022dab262fe14e5e
      - name: Capture verified Mermaid editor before presentation changes
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --mermaid-ui artifacts/native/ux-base/src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/mermaid-baseline --baseline
      - name: Capture current native shell
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --ux-screenshots src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/ux-current ${{ github.sha }}
      - name: Capture actual high contrast on the disposable desktop
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --ux-screenshots src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/ux-high-contrast ${{ github.sha }} --high-contrast
      - name: Exercise desktop UX controls and synchronisation
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --ux-controls src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/ux-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ux-visual-evidence
          path: |
            artifacts/native/mermaid-baseline/*.png
            artifacts/native/mermaid-baseline/*.json
            artifacts/native/ux-baseline/*.png
            artifacts/native/ux-baseline/*.json
            artifacts/native/ux-current/*.png
            artifacts/native/ux-current/*.json
            artifacts/native/ux-controls/*.png
            artifacts/native/ux-controls/*.json
            artifacts/native/ux-controls/refinement-display/*.json
            artifacts/native/ux-high-contrast/*.png
            artifacts/native/ux-high-contrast/*.json
          retention-days: 14
