name: Validate native Windows edition
on:
  push:
    branches: [develop, 'feature/native-wpf-rebuild']
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned native dependencies
        run: dotnet restore src/native/LensDocsStudio.Native.slnx --locked-mode
      - name: Build native solution
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release --no-restore
      - name: Test document safety and parsing
        run: dotnet test src/native/LensDocsStudio.Core.Tests -c Release --no-build --logger "trx;LogFileName=native-core.trx" --results-directory artifacts/native/tests
      - name: Validate native diagram corpus
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- artifacts/native/validation .
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation
          path: artifacts/native/
          retention-days: 14
