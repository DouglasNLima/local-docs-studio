# INERT PROPOSAL: no workflow is installed or dispatched by this file.
# If separately approved, use .github/workflows/native.yml only on the isolated
# validation/preview-loading-once branch, with a [skip ci] preparation commit.
name: Controlled preview loading validation
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact provenance-approved correction commit'
        required: true
        type: string
      candidate_tree:
        description: 'Exact provenance-approved correction tree'
        required: true
        type: string
permissions:
  contents: read
env:
  LENS_NATIVE_ACCEPTANCE_POLICY: internal-no-associations
  LENS_NATIVE_WIZARD_ARGUMENTS: --no-file-associations
  LENS_NATIVE_LIFECYCLE_ARGUMENTS: -NoFileAssociations
jobs:
  preview-loading-controlled:
    name: Preview loading controlled validation (not required CI acceptance)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Record and verify the authorised identities before execution
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_CANDIDATE_TREE: ${{ inputs.candidate_tree }}
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'Reruns require a new owner decision; this workflow accepts attempt 1 only.' }
          if ($env:GITHUB_REF -ne 'refs/heads/validation/preview-loading-once') { throw 'Unexpected validation control branch.' }
          if ($env:EXPECTED_CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_CANDIDATE_TREE -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact commit and tree identifiers are required.' }
          $candidateHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateTree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($candidateHead -ne $env:EXPECTED_CANDIDATE_SHA -or $candidateTree -ne $env:EXPECTED_CANDIDATE_TREE) { throw 'Candidate source identity drifted.' }
          $candidateStatus = git status --porcelain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($candidateStatus) { throw 'Candidate source is dirty.' }
          New-Item -ItemType Directory -Path artifacts/native/preview-loading-control -Force | Out-Null
          @{ candidateCommit = $candidateHead; candidateTree = $candidateTree; workflowRef = $env:GITHUB_WORKFLOW_REF; workflowSha = $env:GITHUB_WORKFLOW_SHA; runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; requiredCiAcceptance = $false } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/native/preview-loading-control/source.json
      - name: Require the approved provenance amendment
        shell: pwsh
        run: |
          python scripts/compliance/check_governance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/compliance/test_governance.py
          exit $LASTEXITCODE
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build pinned complex ER and preview lifecycle checks
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify complete ER geometry native conversion inspection and exports
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --complex-er artifacts/native/complex-er .
      - name: Verify shown Light and Dark preview loading with UI Automation
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --preview-loading-ui artifacts/native/preview-loading .
      - name: Verify loading with actual Windows High Contrast
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --preview-loading-ui artifacts/native/preview-loading-high-contrast . --high-contrast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-loading-once-${{ github.run_id }}
          path: |
            artifacts/native/preview-loading-control/
            artifacts/native/complex-er/
            artifacts/native/preview-loading/
            artifacts/native/preview-loading-high-contrast/
          retention-days: 14
