name: Validate native Windows edition
on:
  push:
    branches: [develop, 'feature/native-wpf-rebuild', 'release/native-preview-readiness', 'feature/native-desktop-ux-modernisation', 'feature/native-ux-refinement', 'feature/native-mermaid-visual-editor', 'feature/native-mermaid-editor-visual-polish', 'feature/native-mermaid-preview-fidelity']
  pull_request:
    branches: [develop, 'feature/native-wpf-rebuild', 'release/native-preview-readiness', 'feature/native-desktop-ux-modernisation', 'feature/native-ux-refinement', 'feature/native-mermaid-visual-editor', 'feature/native-mermaid-editor-visual-polish']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned native dependencies
        run: dotnet restore src/native/LensDocsStudio.Native.slnx --locked-mode
      - name: Build native solution
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release --no-restore
      - name: Test document safety and parsing
        run: dotnet test src/native/LensDocsStudio.Core.Tests -c Release --no-build --logger "trx;LogFileName=native-core.trx" --results-directory artifacts/native/tests
      - name: Validate pluggable signing policy
        run: pwsh -NoProfile -File scripts/native/Test-NativeSigning.ps1
      - name: Validate Windows signature trust with a disposable certificate
        timeout-minutes: 3
        run: pwsh -NoProfile -File scripts/native/Test-NativeAuthenticode.ps1
      - name: Validate native diagram corpus
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- artifacts/native/validation .
      - name: Probe production Unicode and malformed-input safety in isolated processes
        timeout-minutes: 4
        run: |
          $results = @()
          foreach ($fixture in 'ordinary','malformed','combining') {
            & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --preview-input-safety "artifacts/native/input-safety/$fixture" $fixture
            $results += @{ fixture=$fixture; exitCode=$LASTEXITCODE }
          }
          $results | ConvertTo-Json | Set-Content artifacts/native/input-safety/process-exits.json
          if (@($results | Where-Object { $_.exitCode -ne 0 }).Count) { throw 'Production input-safety probe failed. Preserve evidence and investigate; no retry or threshold change.' }
      - name: Record Continuous input-budget observations (250 ms acceptance reported separately)
        run: |
          dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --continuous-performance artifacts/native/validation/continuous-input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --continuous-performance artifacts/native/validation/continuous-mixed mixed
      - name: Set up export validation tools
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install static export browser checks
        run: |
          npm ci
          npx playwright install chromium
      - name: Check native catalogue against the web reference
        run: node scripts/native/Sync-ContentCatalogue.mjs --check
      - name: Set up the static export test runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate exported Docs Site on disk and static hosting
        env:
          LENS_TEST_PORT: '4183'
          DEBUG: 'pw:webserver'
        run: npx playwright test --config playwright.native-export.config.mjs
      - name: Validate native desktop workflows
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/ui
      - name: Validate recovery after interrupted failed saves
        timeout-minutes: 3
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --interrupted-save src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/interrupted-save
      - name: Build isolated self-contained preview versions
        run: |
          pwsh -NoProfile -File scripts/native/Build-NativePackage.ps1 -Version "0.1.0-preview.${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/native/Build-NativePackage.ps1 -Version "0.1.1-preview.${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate visible installer wizard
        timeout-minutes: 4
        run: dotnet run --project src/native/LensDocsStudio.Native.Validation -c Release --no-build -- --installer-wizard "artifacts/native/packages/0.1.0-preview.${{ github.run_number }}/LensDocsStudio.Native-0.1.0-preview.${{ github.run_number }}-win-x64-Setup.exe" artifacts/native/installer-wizard
      - name: Independently verify preview packages and negative controls
        run: |
          foreach ($base in '0.1.0','0.1.1') {
            $version = "$base-preview.${{ github.run_number }}"
            pwsh -NoProfile -File scripts/native/Test-NativePreviewPackage.ps1 -PackageDirectory "artifacts/native/packages/$version" -ExpectedVersion $version -ExpectedSourceRevision (git rev-parse HEAD) -OutputPath "artifacts/native/packages/$version/package-verification.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pwsh -NoProfile -File scripts/native/Test-NativePreviewPackageControls.ps1 -PackageDirectory "artifacts/native/packages/0.1.1-preview.${{ github.run_number }}" -OutputDirectory artifacts/native/package-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate installation upgrade and uninstall lifecycle
        run: pwsh -NoProfile -File scripts/native/Test-NativeInstaller.ps1 -Installer "artifacts/native/packages/0.1.0-preview.${{ github.run_number }}/LensDocsStudio.Native-0.1.0-preview.${{ github.run_number }}-win-x64-Setup.exe" -UpgradeInstaller "artifacts/native/packages/0.1.1-preview.${{ github.run_number }}/LensDocsStudio.Native-0.1.1-preview.${{ github.run_number }}-win-x64-Setup.exe"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation
          path: |
            artifacts/native/tests/
            artifacts/native/input-safety/
            artifacts/native/package-controls/*.json
            artifacts/native/authenticode/**/*.json
            artifacts/native/signing-adapters/**/signing-adapters.json
            artifacts/native/validation/
            artifacts/native/ui/
            artifacts/native/interrupted-save/
            artifacts/native/site-browser/
            artifacts/native/installer-wizard/
            artifacts/native/install-smoke/**/installer-results.json
            artifacts/native/install-smoke/**/*.log
            artifacts/native/install-smoke/**/native-ui.json
            artifacts/native/install-smoke/**/native-ui-runtime.json
            artifacts/native/install-smoke/**/native-desktop-restored-session.*
            artifacts/native/install-smoke/**/native-desktop-restored-session-observations.json
            artifacts/native/install-smoke/**/native-minimum-window.*
            artifacts/native/install-smoke/**/native-refinement*
            artifacts/native/install-smoke/**/refinement-display/*.json
            artifacts/native/install-smoke/**/native-minimum-overflow.png
            artifacts/native/install-smoke/**/native-focus-mode.png
            artifacts/native/install-smoke/**/native-full-screen.png
            artifacts/native/install-smoke/**/native-quick-open.png
            artifacts/native/install-smoke/**/native-command-palette.png
            artifacts/native/install-smoke/**/native-about.*
            artifacts/native/install-smoke/**/native-quick-start.*
            artifacts/native/install-smoke/**/native-paste-error-acknowledgement.json
            artifacts/native/install-smoke/**/native-updates-command.json
            artifacts/native/install-smoke/**/native-details-keyboard.json
            artifacts/native/install-smoke/**/native-ui-word-import.json
            artifacts/native/install-smoke/**/native-ui-inline-labels.json
            artifacts/native/install-smoke/**/native-inline-labels.png
            artifacts/native/install-smoke/**/native-ui-table-editor.json
            artifacts/native/install-smoke/**/native-table-editor.png
            artifacts/native/install-smoke/**/native-ui-workspace-context-*.json
            artifacts/native/install-smoke/**/native-workspace-context-session-observations.json
            artifacts/native/install-smoke/**/native-workspace-context-*.png
            artifacts/native/install-smoke/**/native-word-import.png
            artifacts/native/install-smoke/**/native-word-import-pages.json
            artifacts/native/install-smoke/**/native-word-import-page-*.png
            artifacts/native/install-smoke/**/native-ui-diagram-themes.json
            artifacts/native/install-smoke/**/native-ui-diagram-clipboard*.json
            artifacts/native/install-smoke/**/native-diagram-clipboard*.png
            artifacts/native/install-smoke/**/native-diagram-forest-*.png
            artifacts/native/install-smoke/**/native-ui-diagram-errors.json
            artifacts/native/install-smoke/**/native-diagram-error.png
            artifacts/native/install-smoke/**/restored-session.json
            artifacts/native/install-smoke/**/restored-session.png
            artifacts/native/install-smoke/**/interrupted-save.json
            artifacts/native/install-smoke/**/blocked-save.png
            artifacts/native/install-smoke/**/recovered-draft.png
            artifacts/native/install-smoke/**/native-ui-failure*
            artifacts/native/install-smoke/**/native-save-dialogue-failure.png
            artifacts/native/install-smoke/**/native-save-dialogues.json
            artifacts/native/install-smoke/**/native-artefact-folder-failure.png
            artifacts/native/install-smoke/**/native-artefact-folder-controls.txt
            artifacts/native/install-smoke/**/native-preview-selection.json
            artifacts/native/install-smoke/**/native-continuous-preview-selection.json
            artifacts/native/install-smoke/**/native-continuous-preview-search.png
            artifacts/native/install-smoke/**/native-paginated-preview-search.png
            artifacts/native/install-smoke/**/native-single-block-selection.json
            artifacts/native/install-smoke/**/native-single-block-preview-search.png
            artifacts/native/install-smoke/**/native-pdf-decorations.png
            artifacts/native/install-smoke/**/decorated-text.pdf
            artifacts/native/packages/*/*.exe
            artifacts/native/packages/*/*.zip
            artifacts/native/packages/*/*.json
            artifacts/native/packages/*/SHA256SUMS.txt
          retention-days: 14
