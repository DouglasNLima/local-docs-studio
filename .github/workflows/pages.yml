name: Publish Lens Docs Studio

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test static app (${{ matrix.browser }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, edge]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Set up the test-only Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run checks
        env:
          DEBUG: pw:browser,pw:webserver
          LENS_TEST_BROWSER: ${{ matrix.browser }}
        run: npm test

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  test-summary:
    name: Test static app
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both browser projects
        env:
          LENS_BROWSER_RESULT: ${{ needs.test.result }}
        run: test "$LENS_BROWSER_RESULT" = success

  deploy:
    name: Deploy to GitHub Pages
    needs: test-summary
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static Pages artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pages-artifact | Out-Null
          Copy-Item -Path index.html, md-mmd-renderer-v5.html, manifest.webmanifest, service-worker.js, icon.svg -Destination pages-artifact
          Copy-Item -Path assets -Destination pages-artifact -Recurse
          Copy-Item -Path docs -Destination pages-artifact -Recurse
          Set-Content -Path pages-artifact/.nojekyll -Value ''

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
