name: Native Continuous TextFormatter feasibility
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  paired-diagnostic:
    if: github.head_ref == 'feature/goal56-native-continuous-layout-prototype'
    name: List layout diagnostic (replication ${{ matrix.replication }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Same-host complete-layout diagnostic, every original outcome retained
        run: pwsh -NoProfile -File scripts/native/Test-ContinuousTextFormatterPrototype.ps1 -Replication ${{ matrix.replication }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-textformatter-${{ matrix.replication }}
          path: artifacts/continuous-textformatter-prototype/
          retention-days: 30
