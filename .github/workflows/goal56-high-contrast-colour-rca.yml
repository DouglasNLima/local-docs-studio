name: Goal 56 High Contrast colour RCA
on:
  push:
    branches: ['experiment/goal56-high-contrast-colour-rca']
    paths:
      - 'scripts/native/diagnostics/high-contrast-colour/**'
      - '.github/workflows/goal56-high-contrast-colour-rca.yml'
permissions:
  contents: read
jobs:
  same-host-colour-controls:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute the committed bounded protocol once
        shell: pwsh
        run: scripts/native/diagnostics/high-contrast-colour/Invoke-ColourRca.ps1 -EvidenceRoot artifacts/native/goal56-colour-rca
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal56-high-contrast-colour-rca
          path: |
            artifacts/native/goal56-colour-rca/*.json
            artifacts/native/goal56-colour-rca/*.log
            artifacts/native/goal56-colour-rca/*.txt
            artifacts/native/goal56-colour-rca/*.diff
            artifacts/native/goal56-colour-rca/*-original-order/*.json
            artifacts/native/goal56-colour-rca/*-original-order/*.png
            artifacts/native/goal56-colour-rca/*-transition/**/*.json
            artifacts/native/goal56-colour-rca/*-transition/**/*.png
          retention-days: 30
          if-no-files-found: error
