name: Validate pinned native topology compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact-source ordinary application and compatibility client
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Prove ordinary Architecture C4 Context Container Component and Block preview and exports
        run: src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --topology-compatibility artifacts/native/topology-compatibility .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-topology-compatibility
          path: artifacts/native/topology-compatibility/
          retention-days: 30
