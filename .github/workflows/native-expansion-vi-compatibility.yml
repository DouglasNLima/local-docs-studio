name: Validate pinned native Expansion VI compatibility
on:
  push:
    branches: [feature/native-mermaid-packet-treeview-treemap-venn-editors]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact-source ordinary application and compatibility client
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify unchanged previous editor source fixtures
        run: pwsh -NoProfile -File scripts/native/Test-NativeEditorBaseline.ps1
      - name: Prove ordinary Packet TreeView Treemap and Venn preview and exports before editor acceptance
        run: src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --expansion-vi-compatibility artifacts/native/expansion-vi-compatibility .
      - name: Test source guards and all existing Core contracts
        run: dotnet test src/native/LensDocsStudio.Core.Tests -c Release --no-build --logger "trx;LogFileName=core.trx" --results-directory artifacts/native/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-expansion-vi-compatibility
          path: |
            artifacts/native/expansion-vi-compatibility/
            artifacts/native/editor-baseline.json
            artifacts/native/tests/
          retention-days: 30
