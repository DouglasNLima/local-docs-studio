name: Validate expanded native Mermaid editors
on:
  push:
    branches: [feature/native-windows-ux-release-readiness, feature/native-mermaid-gantt-mindmap-pie-editors, feature/native-mermaid-timeline-journey-quadrant-editors, feature/native-mermaid-xy-radar-sankey-editors, feature/native-mermaid-kanban-requirement-gitgraph-editors, feature/native-mermaid-architecture-c4-block-editors, feature/native-mermaid-packet-treeview-treemap-venn-editors]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-source-editors-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authoring:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [Gantt, Mindmap, Pie, Timeline, Journey, Quadrant, Xy, Radar, Sankey, Kanban, Requirement, GitGraph, Architecture, C4, Block, Packet, TreeView, Treemap, Venn]
        appearance: [normal, high-contrast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build exact-source ordinary native application and independent UIA client
        run: dotnet build src/native/LensDocsStudio.Native.slnx -c Release -p:RestoreLockedMode=true
      - name: Verify full canonical pixels, geometry, compiled workspace style and owner sessions
        run: src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --source-editor-fidelity artifacts/native/source-editor-fidelity
      - name: Verify chart compatibility and complete canonical editor pixels
        run: |
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --chart-compatibility artifacts/native/chart-compatibility .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --chart-editor-fidelity artifacts/native/chart-editor-fidelity .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove pinned workflow compatibility and exact editor correspondence
        run: |
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --workflow-compatibility artifacts/native/workflow-compatibility .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --workflow-editor-fidelity artifacts/native/workflow-editor-fidelity .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove all topology variants and complete canonical editor pixels
        run: |
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --topology-compatibility artifacts/native/topology-compatibility .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --topology-editor-fidelity artifacts/native/topology-editor-fidelity .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove four bounded Expansion VI families through complete canonical pixels and ordinary exports
        run: |
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --expansion-vi-compatibility artifacts/native/expansion-vi-compatibility .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --expansion-vi-editor-fidelity artifacts/native/expansion-vi-editor-fidelity .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise complete native authoring through normal application routes
        # Retain all 30 earlier appearances and add eight bounded Expansion VI appearances.
        shell: pwsh
        run: |
          $appearance = if ('${{ matrix.appearance }}' -eq 'high-contrast') { '--high-contrast' } else { '--normal' }
          & src/native/LensDocsStudio.Native.Validation/bin/Release/net10.0-windows/LensDocsStudio.Native.Validation.exe --source-editor-ui src/native/LensDocsStudio.Native/bin/Release/net10.0-windows/LensDocsStudio.Native.exe artifacts/native/source-editors '${{ matrix.family }}' $appearance
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.family }}-${{ matrix.appearance }}
          path: |
            artifacts/native/source-editors/
            artifacts/native/source-editor-fidelity/
            artifacts/native/chart-compatibility/
            artifacts/native/chart-editor-fidelity/
            artifacts/native/workflow-compatibility/
            artifacts/native/workflow-editor-fidelity/
            artifacts/native/topology-compatibility/
            artifacts/native/topology-editor-fidelity/
            artifacts/native/expansion-vi-compatibility/
            artifacts/native/expansion-vi-editor-fidelity/
          retention-days: 30
