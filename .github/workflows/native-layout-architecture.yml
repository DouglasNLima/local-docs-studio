name: Experimental Continuous architecture v2 gate
on:
  push:
    branches: [experiment/native-continuous-layout-architecture]
  workflow_dispatch:
    inputs:
      scope:
        description: Focused diagnosis or complete v2 acceptance
        type: choice
        options: [full, focused]
        default: full
permissions:
  contents: read
jobs:
  six-workload-v2:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    name: Complete six-workload v2 gate (replication ${{ matrix.replication }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Same compiled adapters, complete layout and real GUI/UIA
        run: pwsh -NoProfile -File scripts/native/Test-ContinuousLayoutArchitectureV2.ps1 -Replication ${{ matrix.replication }}
      - name: Deterministic complete-geometry and source checks, without timing assertions
        if: always()
        run: src/native/LensDocsStudio.LayoutExperiment/bin/Release/net10.0-windows/LensDocsStudio.LayoutExperiment.exe --deterministic --output artifacts/layout-architecture-v2/deterministic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-architecture-v2-${{ matrix.replication }}
          path: artifacts/layout-architecture-v2/
          retention-days: 90
      - name: Reviewable diagnostic executable; no installation or runtime fork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXPERIMENT-ONLY-layout-harness-${{ matrix.replication }}
          path: src/native/LensDocsStudio.LayoutExperiment/bin/Release/net10.0-windows/
          retention-days: 90
  focused-diagnostics:
    if: github.event_name == 'push' || inputs.scope == 'focused'
    name: Focused media/appearance diagnosis (${{ matrix.replication }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and exercise unchanged stock route, candidate and minimal dialogue
        shell: pwsh
        run: |
          dotnet build src/native/LensDocsStudio.LayoutExperiment -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = 'false'
          $exe = 'src/native/LensDocsStudio.LayoutExperiment/bin/Release/net10.0-windows/LensDocsStudio.LayoutExperiment.exe'
          $modes = if (${{ matrix.replication }} -eq 1) { @('media-checks','media-controls','appearance','range-checks','parity-all') } else { @('media-controls','media-checks','appearance','range-checks','parity-all') }
          $failed = $false
          foreach ($mode in $modes) {
            $destination = "artifacts/layout-focused/$mode"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            $process = Start-Process -FilePath $exe -ArgumentList @("--$mode",'--output',('"' + $destination + '"')) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$destination/stdout.txt" -RedirectStandardError "$destination/stderr.txt"
            if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; $failed = $true; 'Bounded diagnostic process deadline exceeded.' | Set-Content "$destination/deadline-failure.txt" }
            $process.Refresh()
            if ($process.ExitCode) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Separate appearance sampling profile; never acceptance data
        if: always() && matrix.replication == 1
        shell: pwsh
        run: |
          $destination = 'artifacts/layout-focused/appearance-sampling'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          dotnet tool install dotnet-trace --version 10.0.750501 --tool-path artifacts/layout-profile-tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = 'false'
          $trace = 'artifacts/layout-profile-tools/dotnet-trace.exe'
          $exe = 'src/native/LensDocsStudio.LayoutExperiment/bin/Release/net10.0-windows/LensDocsStudio.LayoutExperiment.exe'
          & $trace --version | Set-Content "$destination/tool-version.txt"
          & $trace collect --profile dotnet-common,dotnet-sampled-thread-time --duration 00:00:00:40 --output "$destination/appearance.nettrace" -- $exe --appearance --output "$destination/observations"
          $collectionExit = $LASTEXITCODE
          & $trace convert "$destination/appearance.nettrace" --format Speedscope --output "$destination/appearance"
          if ($collectionExit) { exit $collectionExit }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-layout-diagnosis-${{ matrix.replication }}
          path: artifacts/layout-focused/
          retention-days: 90
