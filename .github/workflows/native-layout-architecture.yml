name: Experimental Continuous architecture v2 gate
on:
  push:
    branches: [experiment/native-continuous-layout-architecture]
  workflow_dispatch:
    inputs:
      scope:
        description: Focused diagnosis or complete v2 acceptance
        type: choice
        options: [full, focused, compile-comparison, artifact, visual, availability]
        default: full
      runner_image:
        description: Explicit hosted image; each cohort retains its image identity
        type: choice
        options: [windows-latest, windows-2022]
        default: windows-latest
permissions:
  contents: read
jobs:
  runner-availability:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'availability'
    runs-on: ${{ inputs.runner_image }}
    timeout-minutes: 2
    steps:
      - name: Record availability only; no prototype preparation or acceptance
        run: |
          @{ Utc=[DateTime]::UtcNow.ToString('o'); ImageOS=$env:ImageOS; ImageVersion=$env:ImageVersion; Os=[Environment]::OSVersion.ToString(); CpuAvailable=[Environment]::ProcessorCount; AcceptanceData=$false } | ConvertTo-Json
  visual-review-captures:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'visual'
    name: Separate all-theme correctness captures (${{ matrix.replication }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'windows-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Complete paired captures outside all acceptance clocks
        shell: pwsh
        run: |
          & scripts/native/Build-ContinuousLayoutExperiment.ps1 -Compilation ReadyToRun -OutputDirectory artifacts/layout-visual-bin
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = ([bool](git status --porcelain)).ToString()
          $env:LENS_LAYOUT_COMPILATION = 'ReadyToRun'
          if ($env:LENS_LAYOUT_SOURCE_DIRTY -ne 'False') { throw 'Visual review requires clean source.' }
          $destination = 'artifacts/layout-visual'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $process = Start-Process -FilePath artifacts/layout-visual-bin/LensDocsStudio.LayoutExperiment.exe -ArgumentList @('--visual-checks','--output',$destination) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$destination/stdout.txt" -RedirectStandardError "$destination/stderr.txt"
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; '180-second correctness capture bound exceeded.' | Set-Content "$destination/deadline-failure.txt" }
          $process.Refresh()
          $identity = Get-Content "$destination/execution-identity.json" -Raw | ConvertFrom-Json
          @{ Source=$env:LENS_LAYOUT_SOURCE_REVISION; Compilation='ReadyToRun'; RenderingInputsSha256=(& scripts/native/Get-LayoutVisualInputsHash.ps1); WpfFrameworkSha256=(Get-FileHash -LiteralPath $identity.WpfAssembly).Hash; ImageOS=$env:ImageOS; ImageVersion=$env:ImageVersion; CpuAvailable=[Environment]::ProcessorCount; Runtime=$identity.Runtime; TimingAcceptanceData=$false; ExitCode=$process.ExitCode } | ConvertTo-Json | Set-Content "$destination/host.json"
          if ($process.ExitCode) { exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-theme-review-captures-${{ matrix.replication }}
          path: artifacts/layout-visual/
          retention-days: 90
  artifact-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'artifact'
    name: Exact-source experiment executable; no performance reclassification
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'windows-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build diagnostic payload, verify all six deterministic geometries and provenance
        shell: pwsh
        run: |
          & scripts/native/Build-ContinuousLayoutExperiment.ps1 -Compilation ReadyToRun -OutputDirectory artifacts/layout-final-bin
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = ([bool](git status --porcelain)).ToString()
          $env:LENS_LAYOUT_COMPILATION = 'ReadyToRun'
          if ($env:LENS_LAYOUT_SOURCE_DIRTY -ne 'False') { throw 'Exact-source executable requires a clean checkout.' }
          & artifacts/layout-final-bin/LensDocsStudio.LayoutExperiment.exe --deterministic --output artifacts/layout-final-checks
          if ($LASTEXITCODE) { throw 'Downloaded-payload deterministic checks failed.' }
          $identity = Get-Content artifacts/layout-final-checks/execution-identity.json -Raw | ConvertFrom-Json
          $framework = Split-Path -Parent $identity.WpfAssembly
          $runtime = foreach ($name in @('PresentationFramework.dll','PresentationCore.dll','PresentationFramework.Classic.dll')) {
            $path = Join-Path $framework $name
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw "Untrusted shared runtime: $name" }
            @{ Name=$name; Sha256=(Get-FileHash -LiteralPath $path).Hash; Signature=$signature.Status.ToString(); Signer=$signature.SignerCertificate.Subject }
          }
          $payload = @(Get-ChildItem artifacts/layout-final-bin -File -Recurse | ForEach-Object { @{ Path=[IO.Path]::GetRelativePath((Resolve-Path artifacts/layout-final-bin).Path,$_.FullName); Sha256=(Get-FileHash -LiteralPath $_.FullName).Hash } })
          @{ Label='EXPERIMENT ONLY'; Source=$env:LENS_LAYOUT_SOURCE_REVISION; SourceDirty=$false; Compilation='ReadyToRun'; Base='a937399a3f822c4e911e1ebe5ec0e426b64c56ac'; Dependency='9a64dfa5adf79dc447db1f671ea39c94ec42de40'; Runtime=$runtime; Payload=$payload; Deterministic='PASS'; Meaning='Exact-source executable verification only. Controlled v2 results retain their measured source and are not reclassified.' } | ConvertTo-Json -Depth 10 | Set-Content artifacts/layout-final-bin/provenance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXPERIMENT-ONLY-final-source-executable
          path: artifacts/layout-final-bin/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-source-executable-checks
          path: artifacts/layout-final-checks/
          retention-days: 90
  compile-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'compile-comparison'
    name: Bounded IL/ReadyToRun compiler comparison (${{ matrix.replication }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'windows-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile both configurations from identical source; no document prewarm
        shell: pwsh
        run: |
          dotnet build src/native/LensDocsStudio.LayoutExperiment -c Release -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & scripts/native/Build-ContinuousLayoutExperiment.ps1 -Compilation ReadyToRun -OutputDirectory artifacts/layout-compile/r2r
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = ([bool](git status --porcelain)).ToString()
          $order = if (${{ matrix.replication }} -eq 1) { @('IL','R2R') } else { @('R2R','IL') }
          $runs = @()
          foreach ($scenario in @('list','mixed')) {
            foreach ($configuration in $order) {
              $env:LENS_LAYOUT_COMPILATION = if ($configuration -eq 'IL') { 'IL' } else { 'ReadyToRun' }
              $exe = if ($configuration -eq 'IL') { 'src/native/LensDocsStudio.LayoutExperiment/bin/Release/net10.0-windows/LensDocsStudio.LayoutExperiment.exe' } else { 'artifacts/layout-compile/r2r/LensDocsStudio.LayoutExperiment.exe' }
              $destination = "artifacts/layout-compile/observations/$scenario-$configuration"
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              $process = Start-Process -FilePath $exe -ArgumentList @('--scenario',$scenario,'--adapter','candidate','--contract-v2','--output',('"' + $destination + '"')) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$destination/stdout.txt" -RedirectStandardError "$destination/stderr.txt"
              if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force }
              $process.Refresh()
              $runs += @{ Configuration=$configuration; Scenario=$scenario; ExitCode=$process.ExitCode; Directory=$destination }
            }
          }
          @{ Source=(git rev-parse HEAD); SourceDirty=$env:LENS_LAYOUT_SOURCE_DIRTY; InitialCompilerOrder=$order; Runs=$runs; Sdk=(dotnet --info); Meaning='Additional fresh-process compiler pilot only; not the original 66-sample protocol or parity acceptance. No forced collection or prewarm.' } | ConvertTo-Json -Depth 8 | Set-Content artifacts/layout-compile/compiler-pilot.json
          if (@($runs | Where-Object ExitCode -ne 0).Count) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-pilot-${{ matrix.replication }}
          path: artifacts/layout-compile/
          retention-days: 90
  six-workload-v2:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    name: Complete six-workload v2 gate (replication ${{ matrix.replication }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'windows-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Same compiled adapters, complete layout and real GUI/UIA
        run: pwsh -NoProfile -File scripts/native/Test-ContinuousLayoutArchitectureV2.ps1 -Replication ${{ matrix.replication }} -Compilation ReadyToRun
      - name: Deterministic complete-geometry and source checks, without timing assertions
        if: always()
        run: artifacts/layout-experiment-bin/LensDocsStudio.LayoutExperiment.exe --deterministic --output artifacts/layout-architecture-v2/deterministic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-architecture-v2-${{ matrix.replication }}
          path: artifacts/layout-architecture-v2/
          retention-days: 90
      - name: Reviewable diagnostic executable; no installation or runtime fork
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXPERIMENT-ONLY-layout-harness-${{ matrix.replication }}
          path: artifacts/layout-experiment-bin/
          retention-days: 90
  focused-diagnostics:
    if: github.event_name == 'push' || inputs.scope == 'focused'
    name: Focused media/appearance diagnosis (${{ matrix.replication }})
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'windows-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and exercise unchanged stock route, candidate and minimal dialogue
        shell: pwsh
        run: |
          & scripts/native/Build-ContinuousLayoutExperiment.ps1 -Compilation ReadyToRun -OutputDirectory artifacts/layout-focused-bin
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = 'false'
          $env:LENS_LAYOUT_COMPILATION = 'ReadyToRun'
          $exe = 'artifacts/layout-focused-bin/LensDocsStudio.LayoutExperiment.exe'
          New-Item -ItemType Directory -Force -Path artifacts/layout-focused | Out-Null
          Copy-Item -LiteralPath artifacts/layout-focused-bin/compilation.json -Destination artifacts/layout-focused/compilation.json
          $modes = if (${{ matrix.replication }} -eq 1) { @('media-checks','media-client-sta-control','media-legacy-directory','media-controls','appearance','appearance-worker-theme-control','appearance-controls','range-checks','parity-all','lifecycle','studio-checks','link-checks','image-clipboard-checks','visual-checks') } else { @('media-controls','media-legacy-directory','media-client-sta-control','media-checks','appearance-controls','appearance-worker-theme-control','appearance','range-checks','parity-all','lifecycle','studio-checks','link-checks','image-clipboard-checks','visual-checks') }
          $failed = $false
          foreach ($mode in $modes) {
            Write-Host "Focused mode $mode started at $([DateTime]::UtcNow.ToString('o'))"
            $destination = "artifacts/layout-focused/$mode"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            $process = Start-Process -FilePath $exe -ArgumentList @("--$mode",'--output',('"' + $destination + '"')) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$destination/stdout.txt" -RedirectStandardError "$destination/stderr.txt"
            if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; $failed = $true; 'Bounded diagnostic process deadline exceeded.' | Set-Content "$destination/deadline-failure.txt" }
            $process.Refresh()
            if ($process.ExitCode) { $failed = $true }
            Write-Host "Focused mode $mode exited $($process.ExitCode) at $([DateTime]::UtcNow.ToString('o'))"
          }
          foreach ($scenario in @('list','mixed','paragraphs','table-spans','table-blocks','nested-numbering')) {
            $destination = "artifacts/layout-focused/actual-uia-$scenario"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            $process = Start-Process -FilePath $exe -ArgumentList @('--scenario',$scenario,'--adapter','candidate','--uia','--contract-v2','--output',('"' + $destination + '"')) -WindowStyle Hidden -PassThru -RedirectStandardOutput "$destination/stdout.txt" -RedirectStandardError "$destination/stderr.txt"
            if (-not $process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; $failed = $true; '120-second diagnostic process deadline exceeded.' | Set-Content "$destination/deadline-failure.txt" }
            $process.Refresh(); if ($process.ExitCode) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Separate appearance/list/mixed sampling profiles; never acceptance data
        if: always() && matrix.replication == 1
        shell: pwsh
        run: |
          dotnet tool install dotnet-trace --version 10.0.750501 --tool-path artifacts/layout-profile-tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LENS_LAYOUT_SOURCE_REVISION = (git rev-parse HEAD)
          $env:LENS_LAYOUT_SOURCE_DIRTY = 'false'
          $trace = 'artifacts/layout-profile-tools/dotnet-trace.exe'
          $env:LENS_LAYOUT_COMPILATION = 'ReadyToRun'
          $exe = 'artifacts/layout-focused-bin/LensDocsStudio.LayoutExperiment.exe'
          foreach ($scenario in @('appearance','list','mixed')) {
            $destination = "artifacts/layout-focused/$scenario-sampling"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            & $trace --version | Set-Content "$destination/tool-version.txt"
            [string[]]$arguments = if ($scenario -eq 'appearance') { @('--appearance') } else { @('--scenario',$scenario,'--adapter','candidate','--contract-v2') }
            & $trace collect --profile dotnet-common,dotnet-sampled-thread-time --duration 00:00:00:40 --output "$destination/profile.nettrace" -- $exe @arguments --output "$destination/observations"
            $collectionExit = $LASTEXITCODE
            $actual = Get-Content "$destination/observations/execution-identity.json" -Raw | ConvertFrom-Json
            $expected = @($arguments) + @('--output',"$destination/observations")
            if (($actual.Arguments | ConvertTo-Json -Compress) -ne ($expected | ConvertTo-Json -Compress)) { throw 'Profiler child workload arguments differ; retain the trace without mislabelling its scenario.' }
            & $trace convert "$destination/profile.nettrace" --format Speedscope --output "$destination/profile"
            if ($collectionExit) { exit $collectionExit }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-layout-diagnosis-${{ matrix.replication }}
          path: artifacts/layout-focused/
          retention-days: 90
