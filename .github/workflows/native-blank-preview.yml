name: Native blank preview correctness investigation
on:
  push:
    branches: [fix/native-blank-preview-lifecycle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  develop-first:
    name: Exact develop first (unchanged journey)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce exact develop then exact PR 76
        shell: pwsh
        run: |
          & scripts/native/Measure-NativeUx.ps1 -Fixtures mixed -Processes 4 -Iterations 3 -Order baseline-first
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blank-preview-develop-first
          path: |
            artifacts/native-ux/protocol.json
            artifacts/native-ux/processes.json
            artifacts/native-ux/report*
            artifacts/native-ux/samples/
          retention-days: 30
  trace-baselines:
    needs: develop-first
    if: ${{ !cancelled() }}
    name: Trace (${{ matrix.baseline }}, ${{ matrix.appearance }}, ${{ matrix.order }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: [develop, historical]
        appearance: [normal, high-contrast]
        order: [baseline-first, candidate-first]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace exact products without changing the journey or its deadline
        shell: pwsh
        env:
          LENS_NATIVE_TRANSITION_TRACE: '1'
        run: |
          $baseline = if ('${{ matrix.baseline }}' -eq 'develop') { '99349d82eb06960eb1f9785cf384db2373aed4fa' } else { '0237b08390d5d1d946c0b19b81d671ccd54fb951' }
          & scripts/native/Measure-NativeUx.ps1 -BaselineRevision $baseline -Fixtures mixed -Processes 4 -Iterations 3 -Appearance '${{ matrix.appearance }}' -Order '${{ matrix.order }}'
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blank-preview-${{ matrix.baseline }}-${{ matrix.appearance }}-${{ matrix.order }}
          path: |
            artifacts/native-ux/protocol.json
            artifacts/native-ux/processes.json
            artifacts/native-ux/report*
            artifacts/native-ux/samples/
          retention-days: 30
